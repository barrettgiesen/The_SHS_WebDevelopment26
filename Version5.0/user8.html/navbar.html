<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bootstrap Navbar Working</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: #111;
      color: white;
    }
  </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-md navbar-dark bg-dark p-3 shadow">
  <div class="container-fluid">

    <!-- Brand -->
    <a class="navbar-brand fw-bold" href="#">🚀 MySite</a>

    <!-- Toggle Button -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Links -->
    <div class="collapse navbar-collapse" id="navMenu">

      <!-- Left -->
      <div class="navbar-nav">
        <a class="nav-link active" href="#">Home</a>
        <a class="nav-link" href="#">About</a>
        <a class="nav-link disabled">Music</a>
        <a class="nav-link disabled">Contact</a>
      </div>

      <!-- Right -->
      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="#">Login</a>
      </div>

    </div>
  </div>
</nav>

<!-- PAGE CONTENT (so you know it loaded) -->
<div class="container mt-5">
  <h1>Navbar page</h1>
  <p>hi</p>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
