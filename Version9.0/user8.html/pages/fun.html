<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LeBron + Basketball</title>

<style>
    body {
        margin: 0;
        background: radial-gradient(circle, #0b1a2b, #000);
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        flex-direction: column;
        font-family: Arial, sans-serif;
    }

    /* 🔥 Spark container */
    .spark-container {
        position: absolute;
        width: 100%;
        height: 100%;
        overflow: hidden;
        z-index: 0;
    }

    .spark {
        position: absolute;
        width: 6px;
        height: 6px;
        background: white;
        border-radius: 50%;
        opacity: 0.8;
        animation: floatUp 3s linear infinite;
        box-shadow: 0 0 10px white, 0 0 20px cyan;
    }

    @keyframes floatUp {
        0% {
            transform: translateY(100vh) scale(0.5);
            opacity: 0;
        }
        20% { opacity: 1; }
        100% {
            transform: translateY(-10vh) scale(1.2);
            opacity: 0;
        }
    }

    /* ✨ Glowing Text */
    .lebron {
        position: relative;
        z-index: 2;

        font-size: 120px;
        font-weight: 900;
        letter-spacing: 8px;
        text-transform: uppercase;

        background: linear-gradient(90deg, red, orange, yellow, lime, cyan, magenta);
        background-size: 400% 400%;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;

        animation: colorShift 3s infinite linear, glow 1.5s infinite alternate;

        margin-bottom: 60px;
    }

    @keyframes colorShift {
        0% { background-position: 0% 50%; }
        100% { background-position: 100% 50%; }
    }

    @keyframes glow {
        0% { filter: drop-shadow(0 0 10px red); }
        100% { filter: drop-shadow(0 0 25px cyan); }
    }

    /* 🏀 Basketball */
    .ball {
        width: 80px;
        height: 80px;
        background: orange;
        border-radius: 50%;
        position: relative;
        z-index: 2;
        animation: bounce 1s infinite ease-in-out;
        box-shadow: inset -8px -8px 0 rgba(0,0,0,0.3);
    }

    .ball::before,
    .ball::after {
        content: "";
        position: absolute;
        background: black;
        border-radius: 2px;
    }

    .ball::before {
        width: 80px;
        height: 2px;
        top: 50%;
        left: 0;
    }

    .ball::after {
        width: 2px;
        height: 80px;
        left: 50%;
        top: 0;
    }

    @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-120px); }
    }

    /* 🔙 Return Button */
    .back-btn {
        position: absolute;
        top: 20px;
        left: 20px;

        padding: 12px 18px;
        background: white;
        color: black;
        font-weight: bold;
        border: none;
        border-radius: 10px;
        cursor: pointer;

        transition: 0.2s;
        z-index: 3;
    }

    .back-btn:hover {
        background: #ffcc00;
        transform: scale(1.1);
    }

</style>
</head>

<body>

<!-- 🔙 Return Button -->
<button class="back-btn" onclick="window.location.href='index.html'">
    ⬅ Return
</button>

<!-- ✨ Sparks -->
<div class="spark-container" id="sparks"></div>

<!-- 🔥 Text -->
<div class="lebron">LEBRON</div>

<!-- 🏀 Ball -->
<div class="ball"></div>

<script>
    const container = document.getElementById("sparks");

    function createSpark() {
        const spark = document.createElement("div");
        spark.classList.add("spark");

        spark.style.left = Math.random() * window.innerWidth + "px";
        spark.style.animationDuration = (1.5 + Math.random() * 2) + "s";
        spark.style.opacity = Math.random();

        container.appendChild(spark);

        setTimeout(() => {
            spark.remove();
        }, 4000);
    }

    setInterval(createSpark, 80);
</script>

</body>
</html>
